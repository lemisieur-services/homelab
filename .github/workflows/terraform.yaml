name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  discover:
    name: 🔍 Discover Terraform roots
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: gh-arc-runners
    environment: terraform
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Configure lab CA trust
        uses: ./.github/actions/lab-ca
        with:
          op-token: ${{ secrets.OP_TOKEN }}
      - name: Discover changed Terraform roots
        id: roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$RUNNER_TEMP/opentofu-changed-files.jsonl"
          page_file="$RUNNER_TEMP/opentofu-changed-page.json"
          : > "$files"
          page=1
          total=0
          while :; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page" \
              -o "$page_file"
            jq -e 'type == "array"' "$page_file" > /dev/null
            count="$(jq 'length' "$page_file")"
            jq -c '.[]' "$page_file" >> "$files"
            total=$((total + count))
            if [ "$total" -ge 3000 ]; then
              echo "GitHub's pull request file list is limited to 3000 files; refusing an incomplete plan." >&2
              exit 1
            fi
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          roots="$(bash .github/scripts/changed-terraform-roots.sh "$files")"
          echo "Changed Terraform roots: $roots"
          echo "roots=$roots" >> "$GITHUB_OUTPUT"

  plan-or-apply:
    name: "${{ github.event.action == 'closed' && '🚀 Apply' || '📋 Plan' }} - ${{ matrix.root }}"
    needs: discover
    if: needs.discover.outputs.roots != '[]'
    runs-on: gh-arc-runners
    environment: terraform
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.discover.outputs.roots) }}
    concurrency:
      group: opentofu-${{ matrix.root }}-${{ github.event.action == 'closed' && 'apply' || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      ROOT: ${{ matrix.root }}
    defaults:
      run:
        working-directory: terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Configure lab CA trust
        uses: ./.github/actions/lab-ca
        with:
          op-token: ${{ secrets.OP_TOKEN }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false
      - name: Load credentials from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          OP_ENV_FILE: terraform/${{ matrix.root }}/1password.env
          AWS_ACCESS_KEY_ID: op://lab-gha/terraform/key-id
          AWS_SECRET_ACCESS_KEY: op://lab-gha/terraform/secret-key
          AWS_ENDPOINT_URL_S3: op://lab-gha/terraform/endpoint
          AWS_DEFAULT_REGION: op://lab-gha/terraform/region
          PLAN_BUCKET: op://lab-gha/terraform/plan-bucket
      - name: Install AWS CLI v2 (rootless)
        uses: ./.github/actions/install-aws-cli
      - name: Configure S3 path-style access
        run: |
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$RUNNER_TEMP/opentofu-aws-config"
          echo "AWS_CONFIG_FILE=$RUNNER_TEMP/opentofu-aws-config" >> "$GITHUB_ENV"
      - name: Check merged commit is the current main tip
        if: github.event.action == 'closed'
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$main_sha" ] || [ "$main_sha" != "$(git rev-parse HEAD)" ]; then
            echo "Main has advanced since this merge; refusing to apply this plan." >&2
            exit 1
          fi
      - name: Retrieve matching plan from S3
        if: github.event.action == 'closed'
        run: |
          tree="$(git rev-parse HEAD^{tree})"
          key="${ROOT}/pr-${PR_NUMBER}/${PR_HEAD_SHA}/${tree}.tfplan"
          aws s3api get-object --endpoint-url "$AWS_ENDPOINT_URL_S3" --region "$AWS_DEFAULT_REGION" \
            --bucket "$PLAN_BUCKET" --key "$key" "$RUNNER_TEMP/plan.tfplan" > /dev/null
      - name: Initialize OpenTofu
        run: tofu init -lockfile=readonly
      - name: Plan
        if: github.event.action != 'closed'
        run: tofu plan -no-color -out="$RUNNER_TEMP/plan.tfplan"
      - name: Count planned resource changes
        id: counts
        run: |
          counts="$(tofu show -json "$RUNNER_TEMP/plan.tfplan" | jq -ec -f "$GITHUB_WORKSPACE/.github/scripts/terraform-plan-counts.jq")"
          echo "add=$(jq -r '.add' <<< "$counts")" >> "$GITHUB_OUTPUT"
          echo "change=$(jq -r '.change' <<< "$counts")" >> "$GITHUB_OUTPUT"
          echo "delete=$(jq -r '.delete' <<< "$counts")" >> "$GITHUB_OUTPUT"
      - name: Save plan to S3
        if: github.event.action != 'closed'
        run: |
          tree="$(git rev-parse HEAD^{tree})"
          key="${ROOT}/pr-${PR_NUMBER}/${PR_HEAD_SHA}/${tree}.tfplan"
          aws s3api put-object --endpoint-url "$AWS_ENDPOINT_URL_S3" --region "$AWS_DEFAULT_REGION" \
            --bucket "$PLAN_BUCKET" --key "$key" --body "$RUNNER_TEMP/plan.tfplan" > /dev/null
          echo "Saved plan for tree $tree."
      - name: Apply saved plan
        if: github.event.action == 'closed'
        run: tofu apply -no-color "$RUNNER_TEMP/plan.tfplan"
      - name: Remove local plan
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/plan.tfplan"
      - name: Summarize Terraform result
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PHASE: ${{ github.event.action == 'closed' && 'Apply' || 'Plan' }}
          RESULT: ${{ job.status }}
          COUNTS_OUTCOME: ${{ steps.counts.outcome }}
          ADD: ${{ steps.counts.outputs.add }}
          CHANGE: ${{ steps.counts.outputs.change }}
          DELETE: ${{ steps.counts.outputs.delete }}
        run: |
          {
            echo "## Terraform $PHASE - $ROOT"
            echo ""
            echo "**Status:** $RESULT"
            if [ "$COUNTS_OUTCOME" = success ]; then
              echo ""
              echo "**Planned resources:** $ADD to add, $CHANGE to change, $DELETE to delete."
              echo "Replacements count as both an addition and a deletion."
            else
              echo ""
              echo "Planned resource counts are unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report Terraform result on PR
        if: always()
        uses: actions/github-script@v8
        env:
          PHASE: ${{ github.event.action == 'closed' && 'apply' || 'plan' }}
          RESULT: ${{ job.status }}
          COUNTS_OUTCOME: ${{ steps.counts.outcome }}
          ADD: ${{ steps.counts.outputs.add }}
          CHANGE: ${{ steps.counts.outputs.change }}
          DELETE: ${{ steps.counts.outputs.delete }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { ROOT: root, PHASE: phase, RESULT: result, PR_HEAD_SHA: head } = process.env;
            const countsAvailable = process.env.COUNTS_OUTCOME === 'success';
            const counts = countsAvailable
              ? `${process.env.ADD} add, ${process.env.CHANGE} change, ${process.env.DELETE} delete`
              : 'counts unavailable';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = `<!-- terraform-${phase}:${root} -->`;
            const label = phase === 'plan' ? '📋 Plan' : '🚀 Apply';
            const body = [
              marker,
              `### ${label} - \`${root}\``,
              `**Status:** ${result}`,
              `**Planned resources:** ${counts}`,
              'Replacements count as both an addition and a deletion.',
              `**PR head:** \`${head}\``,
              `[View workflow run](${runUrl})`,
            ].join('\n\n');

            if (phase === 'plan') {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: context.sha,
                state: result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure',
                context: `terraform/plan/${root}`,
                description: result === 'success' ? counts : `Plan ${result}: ${counts}`,
                target_url: runUrl,
              });
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: context.issue.number,
              });
              if (pr.state !== 'open' || pr.head.sha !== head) {
                core.notice('Skipping an outdated plan comment.');
                return;
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
            }
