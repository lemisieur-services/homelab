apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-labk8s
  target:
    name: garage-rpc
    creationPolicy: Owner
  data:
    - secretKey: rpcSecret
      remoteRef:
        key: garage-rpc
        property: password
