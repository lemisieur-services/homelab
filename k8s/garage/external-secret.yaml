apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-labk8s
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: rpcSecret
      remoteRef:
        key: garage-secrets
        property: rpc-token
    - secretKey: adminToken
      remoteRef:
        key: garage-secrets
        property: admin-token
    - secretKey: webuiAuthUserPass
      remoteRef:
        key: garage-secrets
        property: webui-auth
