apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-lemisieur-com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: lemisieur-k8s-secrets
    kind: ClusterSecretStore
  target:
    name: vault-lemisieur-com
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: sslcert-vault_lemisieur_com
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: sslcert-vault_lemisieur_com
      property: tls.key