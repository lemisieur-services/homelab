apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-lab-lemisieur-com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-labk8s
    kind: ClusterSecretStore
  target:
    name: k8s-lab-lemisieur-com
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ .cert | b64dec | pkcs12cert }}'
        tls.key: '{{ .cert | b64dec | pkcs12key }}'
  data:
  - secretKey: cert
    remoteRef:
      key: ssl-certificates
      property: k8s-lab-lemisieur-com.pfx