apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-lab-lemisieur-com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-labk8s
    kind: ClusterSecretStore
  target:
    name: k8s-lab-lemisieur-com
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: sslcert-k8s_lab_lemisieur_com
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: sslcert-k8s_lab_lemisieur_com
      property: tls.key