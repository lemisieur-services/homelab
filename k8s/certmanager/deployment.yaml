apiVersion: apps/v1
kind: Deployment
metadata:
  name: certmanager
  labels:
    app.kubernetes.io/name: certmanager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: certmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certmanager
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: certmanager
          image: ghcr.io/cbrosius/homelab_cert_manager/homelab_cert_manager:latest
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: certmanager-data
