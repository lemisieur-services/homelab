apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: certmanager-data
  labels:
    app.kubernetes.io/name: certmanager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 1Gi
