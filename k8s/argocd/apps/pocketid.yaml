apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocketid
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/lemisieur-services/homelab.git
      targetRevision: main
      path: k8s/traefik/certs
    - repoURL: https://anza-labs.github.io/charts
      chart: pocket-id
      targetRevision: 2.2.2
      helm:
        releaseName: pocket-id
        values: |
          host: fed.lab.lemisieur.com
          trustProxy: true
          pocketID:
            image:
              tag: v2.19.2
          secret:
            create: false
            name: pocket-id-secret
          service:
            port: 1411
          persistence:
            data:
              enabled: true
              existingClaim: pocket-id-data
    - repoURL: https://github.com/lemisieur-services/homelab.git
      targetRevision: main
      path: k8s/pocketid
  destination:
    server: https://kubernetes.default.svc
    namespace: pocketid
  # The previous chart omitted this immutable StatefulSet field.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: pocket-id
      namespace: pocketid
      jsonPointers:
        - /spec/serviceName
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
