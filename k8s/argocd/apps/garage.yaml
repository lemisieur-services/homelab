apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: garage
  sources:
    - repoURL: https://github.com/datahub-local/garage-helm.git
      targetRevision: 2e42e83e48a38d357583577e96188713224553de
      path: garage
      helm:
        releaseName: garage
        values: |
          garage:
            secret:
              create: false
              name: garage-secrets
            garageTomlString: |
              metadata_dir = "/mnt/meta"
              data_dir = "/mnt/data"
              db_engine = "lmdb"
              replication_factor = 1
              rpc_bind_addr = "[::]:3901"
              [s3_api]
              api_bind_addr = "[::]:3900"
              s3_region = "garage"
              public_endpoint = "https://s3.lab.lemisieur.com"
              public_endpoint_path_style = true

              [s3_web]
              bind_addr = "[::]:3902"
              root_domain = ".web.garage.invalid"

              [admin]
              api_bind_addr = "[::]:3903"
          image:
            tag: v2.6.0
          deployment:
            replicaCount: 1
          persistence:
            meta:
              storageClass: local-ssd
              size: 1Gi
            data:
              storageClass: local-ssd
              size: 20Gi
          nodeSelector:
            kubernetes.io/arch: amd64
          clusterConfig:
            enabled: true
            layout:
              enabled: true
              capacity: 18G
            buckets: []
            keys: {}
          webui:
            enabled: true
            auth:
              enabled: true
              existingSecret: garage-secrets
    - repoURL: https://github.com/lemisieur-services/homelab.git
      targetRevision: main
      path: k8s/garage
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
