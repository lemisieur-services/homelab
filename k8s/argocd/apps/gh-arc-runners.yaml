apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gh-arc-runners
  namespace: argocd
spec:
  project: github

  sources:
    - repoURL: https://github.com/lemisieur-services/homelab.git
      targetRevision: main
      path: k8s/gh-arc/runners

    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        parameters:
          - name: githubConfigUrl
            value: https://github.com/lemisieur-services
          - name: githubConfigSecret
            value: gh-app
          - name: controllerServiceAccount.namespace
            value: gh-arc-controller
          - name: controllerServiceAccount.name
            value: gha-runner-scale-set-controller
          - name: minRunners
            value: "1"
          - name: maxRunners
            value: "10"
        valuesObject:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 123
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: runner
                  image: ghcr.io/actions/actions-runner:latest
                  command: ["/home/runner/run.sh"]
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]

  destination:
    server: https://kubernetes.default.svc
    namespace: gh-arc-runners

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
