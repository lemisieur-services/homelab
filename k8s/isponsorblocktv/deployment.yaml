apiVersion: apps/v1
kind: Deployment
metadata:
  name: isponsorblocktv
  labels:
    app.kubernetes.io/name: isponsorblocktv
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: isponsorblocktv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isponsorblocktv
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node.kubernetes.io/role
          operator: Equal
          value: proxy
          effect: NoSchedule
      nodeSelector:
        node.kubernetes.io/class: proxy
      containers:
        - name: isponsorblocktv
          image: ghcr.io/dmunozv04/isponsorblocktv:v2.11.0@sha256:d1e876636754fb2b54490feebe3af4a321f7f2a932a2d57b67b2a667eea40823
          imagePullPolicy: IfNotPresent
          workingDir: /app
          # Keep the container available for kubectl exec during initial pairing.
          # Do not launch the worker until setup has saved at least one device.
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Waiting for TV pairing; see k8s/isponsorblocktv/README.md"
              until python3 -c 'import json; c = json.load(open("/app/data/config.json")); assert any(d.get("screen_id") for d in c.get("devices", []))' 2>/dev/null; do
                sleep 10
              done
              exec python3 -u main.pyc --data /app/data
          env:
            - name: iSPBTV_data_dir
              value: /app/data
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Configuration readiness only; upstream has no HTTP health endpoint.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - 'import json; c = json.load(open("/app/data/config.json")); assert any(d.get("screen_id") for d in c.get("devices", []))'
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: isponsorblocktv-data
