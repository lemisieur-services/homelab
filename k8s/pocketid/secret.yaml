apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
  namespace: pocketid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-labk8s
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    template:
      data:
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        DB_CONNECTION_STRING: "file:data/pocket-id.db"
  data:
    - secretKey: encryption_key
      remoteRef:
        key: pocketid-encryption-key
        property: password
