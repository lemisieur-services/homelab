---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gh-oauth-secret
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-labk8s
  target:
    name: gh-oauth-secret
    creationPolicy: Owner
    template:
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
        cookie-secret: "{{ .cookie_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: oauth2proxy-oauth
        property: username
    - secretKey: client_secret
      remoteRef:
        key: oauth2proxy-oauth
        property: password
    - secretKey: cookie_secret
      remoteRef:
        key: oauth2proxy-oauth
        property: cookie