apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-connect
  labels:
    app.kubernetes.io/name: onepassword-connect
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onepassword-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onepassword-connect
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      tolerations:
        - key: node.kubernetes.io/role
          operator: Equal
          value: proxy
          effect: NoSchedule
      nodeSelector:
        node.kubernetes.io/class: proxy
      containers:
        - name: connect-api
          image: 1password/connect-api:1.8.4@sha256:0f74924c55c9156b8116f59f485223b2c2d30a5148d362562aa27838159bdffa
          env:
            - name: OP_SESSION
              valueFrom:
                secretKeyRef:
                  name: connect-server-credentials
                  key: 1password-credentials.json
            - name: OP_HTTP_PORT
              value: "8080"
            - name: OP_BUS_PORT
              value: "11220"
            - name: OP_BUS_PEERS
              value: localhost:11221
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
        - name: connect-sync
          image: 1password/connect-sync:1.8.4@sha256:ca34850f2a20ca302e688a9347cdb696f29ce3bfc011d2554eff338e315c9089
          env:
            - name: OP_SESSION
              valueFrom:
                secretKeyRef:
                  name: connect-server-credentials
                  key: 1password-credentials.json
            - name: OP_HTTP_PORT
              value: "8081"
            - name: OP_BUS_PORT
              value: "11221"
            - name: OP_BUS_PEERS
              value: localhost:11220
          ports:
            - name: sync-health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: sync-health
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: sync-health
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
      volumes:
        - name: shared-data
          emptyDir: {}
