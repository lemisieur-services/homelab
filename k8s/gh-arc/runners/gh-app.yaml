apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gh-app
  namespace: gh-arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-labk8s
    kind: ClusterSecretStore
  target:
    name: gh-app
  data:
  - secretKey: github_app_id
    remoteRef:
      key: githubarc-ghapp
      property: username
  - secretKey: github_app_installation_id
    remoteRef:
      key: githubarc-ghapp
      property: installation_id
  - secretKey: github_app_private_key
    remoteRef:
      key: githubarc-ghapp-privatekey
      property: private_key.pem
