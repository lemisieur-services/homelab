apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  tls:
    secretName: k8s-lab-lemisieur-com
  routes:
    - match: Host(`headlamp.k8s.lab.lemisieur.com`)
      kind: Rule
      priority: 10
      services:
        - name: headlamp
          port: 80
